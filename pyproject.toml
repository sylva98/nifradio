[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nifradio-mcp"
version = "0.1.0"
description = "小智 AI 收音机：B 站点歌、蜻蜓电台、gitee 歌单的 MCP 工具集"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # mcp 必须锁 1.x：2.0 把 FastMCP 改名、传输层协议也变了
    "mcp>=1.20.0,<2",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.1",
    "websockets>=15.0.1",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.scripts]
nifradio-mcp = "nifradio_mcp:main"

[tool.setuptools]
py-modules = [
    "nifradio_mcp",
    "radio_mcp",
    "radio_core",
    "bili_core",
    "stream_proxy",
]
