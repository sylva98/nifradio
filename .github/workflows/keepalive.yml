name: keepalive

# 云端服务跑在预览型沙箱里，一段时间没有入站请求就会被平台整体停掉
# （错误码 12809「工作空间已停止」）。公网心跳可以持续唤醒它。
# GitHub Actions 在公开仓库免费、定时任务无需任何账号/电脑开机，
# 这里每 5 分钟跑一次，job 内部再连续 ping 若干次，把空档压到最小。

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: 唤醒云端控制台与直连域名
        shell: bash
        run: |
          URLS=(
            "https://nif-radio-console.app.workbuddy.host/health?sharecode=SHLETZEGNA"
            "https://8080-b5d71e36d27248b19b5d3baa7ac989c3.e2b.sh4.sandbox.cloudstudio.club/health"
          )
          for round in 1 2 3 4 5; do
            for u in "${URLS[@]}"; do
              printf '[%s] %s -> ' "$(date -u +%H:%M:%S)" "$u"
              curl -sS -m 15 "$u" 2>/dev/null | head -c 120 || echo "(请求失败)"
              echo
            done
            [ "$round" -lt 5 ] && sleep 45
          done
